name: Captura Revuzee y Google

on:
  schedule:
    # Lunes 6:23 a.m. hora RD (10:23 UTC). GitHub puede retrasarlo unos minutos.
    - cron: "23 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: captura
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Capturar datos
        id: captura
        env:
          REVUZEE_USER: ${{ secrets.REVUZEE_USER }}
          REVUZEE_PASS: ${{ secrets.REVUZEE_PASS }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: python captura.py
      - name: Guardar datos en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Captura $(TZ=America/Santo_Domingo date +%F)"
          git push
      - name: Capturas de pantalla para diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: debug/
          retention-days: 3
